<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حساب فارق السن</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:#f5f5f5;
    margin-top:40px;
}

input,button{
    font-size:18px;
    padding:8px;
    margin:10px;
}

#result{
    margin-top:20px;
    font-size:22px;
    color:blue;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>حساب فارق السن بين تاريخين</h2>

<p>التاريخ الأول:</p>
<input type="date" id="d1">

<p>التاريخ الثاني:</p>
<input type="date" id="d2">

<br>
<button onclick="calcAge()">احسب</button>

<div id="result"></div>

<script>
function calcAge(){

let date1 = new Date(document.getElementById("d1").value);
let date2 = new Date(document.getElementById("d2").value);

if(isNaN(date1) || isNaN(date2)){
    document.getElementById("result").innerHTML="أدخل التاريخين.";
    return;
}

// ترتيب التاريخين إذا كان الأول أكبر
if(date1 > date2){
    let t = date1;
    date1 = date2;
    date2 = t;
}

let years = date2.getFullYear() - date1.getFullYear();
let months = date2.getMonth() - date1.getMonth();
let days = date2.getDate() - date1.getDate();

if(days < 0){
    months--;
    let lastMonth = new Date(date2.getFullYear(), date2.getMonth(), 0);
    days += lastMonth.getDate();
}

if(months < 0){
    years--;
    months += 12;
}

document.getElementById("result").innerHTML =
"الفارق هو:<br>" +
years + " سنة و " +
months + " شهر و " +
days + " يوم";
}
</script>

</body>
</html>
